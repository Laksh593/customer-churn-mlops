services:
  postgres:
    image: postgres:16-alpine
    container_name: churn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-churn_db}
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churn_user} -d ${POSTGRES_DB:-churn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-churn_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-churn_db}
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
      - MODEL_NAME=churn-predictor
      - MODEL_VERSION=1

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: customer-churn-mlops-airflow:2.10.2
    container_name: churn-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow_user}:${AIRFLOW_DB_PASSWORD:-airflow_db_dev_password}@postgres:5432/${AIRFLOW_DB:-airflow_db}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-churn_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-churn_db}
      - AIRFLOW_DB=${AIRFLOW_DB:-airflow_db}
      - AIRFLOW_DB_USER=${AIRFLOW_DB_USER:-airflow_user}
      - AIRFLOW_DB_PASSWORD=${AIRFLOW_DB_PASSWORD:-airflow_db_dev_password}
      - _AIRFLOW_WWW_USER_USERNAME=${_AIRFLOW_WWW_USER_USERNAME:-airflow_admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD:-airflow_dev_password}
    volumes:
      - ./scripts:/opt/airflow/scripts:ro
      - airflow_logs:/opt/airflow/logs
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        python3 /opt/airflow/scripts/init_airflow_db.py &&
        /entrypoint airflow db migrate &&
        /entrypoint airflow users delete -u admin || true &&
        /entrypoint airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow_admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow_dev_password}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email "${_AIRFLOW_WWW_USER_USERNAME:-airflow_admin}@example.com" || true
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: customer-churn-mlops-airflow:2.10.2
    container_name: churn-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow_user}:${AIRFLOW_DB_PASSWORD:-airflow_db_dev_password}@postgres:5432/${AIRFLOW_DB:-airflow_db}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnzq8=}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY:-airflow_secret_key_change_in_production}
      - MLFLOW_TRACKING_URI=sqlite:////opt/airflow/mlflow/airflow_mlflow.db
      - MLFLOW_ARTIFACT_LOCATION=/opt/airflow/mlflow/artifacts
      - MLFLOW_EXPERIMENT_NAME=customer-churn-benchmarking
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
      - ./configs:/opt/airflow/configs:ro
      - ./data:/opt/airflow/data:ro
      - ./tests:/opt/airflow/tests:ro
      - airflow_mlflow_data:/opt/airflow/mlflow
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: customer-churn-mlops-airflow:2.10.2
    container_name: churn-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow_user}:${AIRFLOW_DB_PASSWORD:-airflow_db_dev_password}@postgres:5432/${AIRFLOW_DB:-airflow_db}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnzq8=}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - MLFLOW_TRACKING_URI=sqlite:////opt/airflow/mlflow/airflow_mlflow.db
      - MLFLOW_ARTIFACT_LOCATION=/opt/airflow/mlflow/artifacts
      - MLFLOW_EXPERIMENT_NAME=customer-churn-benchmarking
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
      - ./configs:/opt/airflow/configs:ro
      - ./data:/opt/airflow/data:ro
      - ./tests:/opt/airflow/tests:ro
      - airflow_mlflow_data:/opt/airflow/mlflow
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: churn_postgres_data
  airflow_mlflow_data:
    name: churn_airflow_mlflow_data
  airflow_logs:
    name: churn_airflow_logs
