# Training Pipeline Configuration
random_state: 42
validation_metric: "roc_auc"

models:
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42

  random_forest:
    n_estimators: 300
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    eval_metric: "logloss"
