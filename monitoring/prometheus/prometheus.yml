# ── Prometheus Scrape Configuration ──────────────────────────────────────────
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fastapi-prediction-service"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "churn-api"
          environment: "production"
